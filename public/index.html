<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tracker de Hábitos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1, h2 { margin-bottom: 0.5rem; }
    .contenedor { display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; min-width: 280px; }
    label { display: block; margin-top: 0.5rem; font-size: 0.9rem; }
    input, select { width: 100%; padding: 0.3rem; margin-top: 0.2rem; box-sizing: border-box; }
    button { margin-top: 0.7rem; padding: 0.3rem 0.8rem; cursor: pointer; }
    ul { padding-left: 1.2rem; }
    li { margin-bottom: 0.5rem; }
    .acciones button { margin-right: 0.3rem; }
    .tag { font-size: 0.8rem; padding: 0.1rem 0.4rem; border-radius: 4px; }
    .tag-completado { background: #d4edda; }
    .tag-pendiente { background: #fff3cd; }
  </style>
</head>
<body>
  <h1>Tracker de Hábitos</h1>

  <div class="contenedor">
    <!-- Formulario crear hábito -->
    <div class="card">
      <h2>Crear nuevo hábito</h2>
      <form id="form-crear">
        <label>
          Título
          <input type="text" id="titulo" required />
        </label>
        <label>
          Descripción
          <input type="text" id="descripcion" />
        </label>
        <label>
          Categoría
          <input type="text" id="categoria" placeholder="Salud, Estudio, Trabajo..." />
        </label>
        <label>
          Duración (minutos)
          <input type="number" id="duracion" min="1" required />
        </label>
        <button type="submit">Guardar hábito</button>
      </form>
    </div>

    <!-- Filtros -->
    <div class="card">
      <h2>Filtros</h2>
      <form id="form-filtros">
        <label>
          Categoría
          <input type="text" id="filtro-categoria" />
        </label>
        <label>
          Completado
          <select id="filtro-completado">
            <option value="">(Todos)</option>
            <option value="true">Completados</option>
            <option value="false">Pendientes</option>
          </select>
        </label>
        <label>
          Duración mínima (min)
          <input type="number" id="filtro-min" min="0" />
        </label>
        <label>
          Duración máxima (min)
          <input type="number" id="filtro-max" min="0" />
        </label>
        <button type="submit">Aplicar filtros</button>
        <button type="button" onclick="limpiarFiltros()">Limpiar filtros</button>
      </form>
    </div>
  </div>

  <!-- Listado -->
  <div class="card" style="margin-top: 1.5rem;">
    <h2>Listado de Hábitos</h2>
    <button onclick="cargarHabitos()">Recargar lista</button>
    <p id="resumen"></p>
    <ul id="lista-habitos"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
